spring.application.name=PawCare
server.port=${PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pawcare}
spring.datasource.username=${DB_USERNAME:pawcare_user}
spring.datasource.password=${DB_PASSWORD:pawcare_pass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET:pawcare-development-secret-key-change-me-please}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.jwt.cookie-secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

logging.level.org.hibernate.SQL=warn
