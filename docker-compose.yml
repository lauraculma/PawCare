services:
  db:
    image: postgres:17-alpine
    container_name: pawcare-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pawcare}
      # Keep the Docker database credentials separate from local PostgreSQL settings.
      POSTGRES_USER: ${DOCKER_DB_USER:-${DB_USERNAME:-pawcare}}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-${DB_PASSWORD:-pawcare}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pawcare-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-pawcare}
      DB_USERNAME: ${DOCKER_DB_USER:-${DB_USERNAME:-pawcare}}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-${DB_PASSWORD:-pawcare}}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env before starting PawCare}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Administrador PawCare}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: pawcare-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: pawcare-nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
